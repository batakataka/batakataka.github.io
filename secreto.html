<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sala TaKá</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Barlow:wght@400;600;800&family=Barlow+Condensed:wght@600;800&display=swap">
<style>
[hidden]{display:none!important}
:root{
  --y:#F7C600; --r:#E32636; --ink:#0E0E0E; --cream:#F3EEE4; --cob:#0047AB;
  --display:"Permanent Marker","Marker Felt","Comic Sans MS",cursive;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  background-image:radial-gradient(80% 50% at 0% 0%,#f5a30033,transparent 60%),radial-gradient(80% 50% at 100% 100%,#d0102a33,transparent 60%)}
.wrap{max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,13vw,76px);line-height:.9;margin:8px 0 4px;transform:rotate(-3deg);color:var(--y);text-shadow:0 4px 0 var(--r)}
.tag{font:800 13px/1.3 var(--num);letter-spacing:.14em;text-transform:uppercase;color:#ffffff99;margin:10px 0 22px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}
.big{display:block;width:100%;border:3px solid var(--ink);border-radius:18px;padding:18px;font:800 20px/1 var(--body);background:var(--y);color:var(--ink);box-shadow:0 5px 0 var(--r);margin-bottom:14px}
.big.alt{background:var(--cream)}
.big.ghost{background:transparent;color:var(--cream);border-color:#ffffff55;box-shadow:none}
.join{display:flex;gap:10px;margin-bottom:14px}
.join input{flex:1;min-width:0;border:3px solid #ffffff55;background:#ffffff10;color:#fff;border-radius:18px;padding:16px;font:800 24px/1 var(--num);letter-spacing:.3em;text-transform:uppercase;text-align:center}
.join button{border:3px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:18px;padding:0 22px;font:800 22px/1 var(--body);box-shadow:0 5px 0 var(--r)}
.err{min-height:1.3em;color:#ff8a8a;font-size:14px}

/* sala */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.top .name{font-family:var(--display);font-size:28px;color:var(--y);transform:rotate(-3deg);margin-right:auto}
.chip{display:inline-flex;align-items:center;gap:8px;border:2px solid #ffffff44;border-radius:999px;padding:8px 12px;font:800 14px/1 var(--num);letter-spacing:.1em;background:#ffffff0d}
.chip b{font-size:18px;letter-spacing:.25em;color:#fff}
.chip.btn{background:var(--cream);color:var(--ink);border-color:var(--ink)}
.people{display:flex;gap:6px;align-items:center}
.people i{width:14px;height:14px;border-radius:50%;display:block;box-shadow:0 0 0 2px var(--ink)}

.label{font:800 12px/1 var(--num);letter-spacing:.16em;text-transform:uppercase;color:#ffffff88;margin:18px 0 8px}
.insts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.inst{position:relative;border:3px solid transparent;border-radius:14px;padding:12px 4px 10px;background:var(--c);color:var(--ink);font:400 clamp(17px,4.6vw,22px)/1 var(--display);text-align:center}
.inst small{display:block;font:800 10px/1.2 var(--num);letter-spacing:.12em;margin-top:5px;opacity:.75}
.inst.me{border-color:#fff;box-shadow:0 0 0 3px var(--ink),0 0 0 6px #fff}
.inst.taken{filter:grayscale(.85) brightness(.55)}
.inst.taken::after{content:"";position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--who,#fff);box-shadow:0 0 0 2px var(--ink)}

.pad{display:block;width:100%;aspect-ratio:2.4/1;border:4px solid var(--ink);border-radius:22px;background:var(--c,#333);color:var(--ink);
  font:400 clamp(48px,15vw,92px)/1 var(--display);box-shadow:0 8px 0 #000;touch-action:none;transition:transform .05s}
.pad.hit{transform:translateY(6px) scale(.985);box-shadow:0 2px 0 #000}
.pad:disabled{opacity:.35}

.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.cell{aspect-ratio:1;border-radius:10px;border:2px solid #ffffff33;background:#ffffff0f;padding:0}
.cell.q{border-color:#ffffff66}
.cell.on{background:var(--c);border-color:var(--ink)}
.cell.now{box-shadow:0 0 0 3px #fff}
.cell:disabled{cursor:default}

.mini{display:grid;gap:3px;margin-top:4px}
.mrow{display:grid;grid-template-columns:44px repeat(16,1fr);gap:3px;align-items:center}
.mrow span{font:400 12px/1 var(--display);color:var(--c)}
.mrow i{display:block;height:12px;border-radius:3px;background:#ffffff14}
.mrow i.on{background:var(--c)}
.mrow i.now{outline:2px solid #fff}

.transport{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.play{flex:1 1 140px;border:3px solid var(--ink);border-radius:16px;padding:14px;font:800 20px/1 var(--body);background:var(--y);color:var(--ink);box-shadow:0 5px 0 var(--r)}
.play.on{background:var(--r);color:#fff;box-shadow:0 5px 0 var(--y)}
.bpm{display:flex;align-items:center;gap:6px;font:800 22px/1 var(--num)}
.bpm button{width:42px;height:42px;border-radius:50%;border:2px solid #ffffff66;background:transparent;font:800 22px/1 var(--body)}
.bpm output{min-width:3.2ch;text-align:center}
.small{border:2px solid #ffffff44;background:transparent;border-radius:12px;padding:10px 12px;font:800 13px/1 var(--num);letter-spacing:.1em;text-transform:uppercase}
.foot{margin-top:26px;text-align:center}
.foot a{color:#ffffff99;font:800 13px/1 var(--num);letter-spacing:.14em;text-decoration:none;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--cream);color:var(--ink);padding:10px 16px;border-radius:999px;font:800 14px/1 var(--body);opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.pad{transition:none}}
</style></head><body>

<!-- bloqueado -->
<div class="wrap" id="locked" hidden>
  <h1>TaKá?</h1>
  <p class="tag">BaTaKá + BaTaKá → BOOM BOOM → ???</p>
  <a class="big" href="index.html" style="text-align:center;text-decoration:none">TaKá ←</a>
</div>

<!-- lobby -->
<div class="wrap" id="lobby" hidden>
  <h1>SALA<br>TaKá</h1>
  <p class="tag">TaKáTaKá!!! · BUM · TAK · TSS · TaKá</p>
  <button class="big" id="create" type="button">+ SALA TaKá</button>
  <div class="join"><input id="code" maxlength="4" inputmode="text" autocomplete="off" placeholder="ABCD" aria-label="Código de sala"><button id="joinBtn" type="button" aria-label="Entrar">→</button></div>
  <button class="big ghost" id="solo" type="button">SOLO TaKá</button>
  <p class="err" id="err"></p>
</div>

<!-- sala -->
<div class="wrap" id="room" hidden>
  <div class="top">
    <div class="name">SALA TaKá</div>
    <span class="chip" id="codeChip" hidden>SALA <b id="codeTxt">----</b></span>
    <button class="chip btn" id="share" type="button" hidden>+ AMIGOS →</button>
    <span class="people" id="people" aria-label="Jugadores"></span>
  </div>

  <div class="label">1 · TaKá?</div>
  <div class="insts" id="insts"></div>

  <div class="label">2 · TaKá!</div>
  <button class="pad" id="pad" type="button" disabled>TaKá?</button>

  <div class="label" id="rowLabel">3 · TaKá × 16</div>
  <div class="grid" id="grid"></div>

  <div class="transport">
    <button class="play" id="play" type="button">▶ TaKá</button>
    <div class="bpm"><button id="bpmDown" type="button" aria-label="Más lento">−</button><output id="bpm">100</output><button id="bpmUp" type="button" aria-label="Más rápido">+</button></div>
    <button class="small" id="clear" type="button">↺ fila</button>
  </div>

  <div class="label">BaTaKá BAND</div>
  <div class="mini" id="mini"></div>

  <div class="foot"><a href="index.html">← BaTaKá</a></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ---------------- config ---------------- */
const SB_URL="https://xsivyjkzjrxcvxomgfgg.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhzaXZ5amt6anJ4Y3Z4b21nZmdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxODU4OTcsImV4cCI6MjEwNzc2MTg5N30.u5GfMwnQZ7szk04R9S0NghGnvXWOcOG50KAT4AgfUAs";
const STEPS=16;
const INST=[
  {k:"bum",  n:"BUM",  d:"bombo",    c:"#F7C600"},
  {k:"tak",  n:"TAK",  d:"caja",     c:"#E32636"},
  {k:"tss",  n:"TSS",  d:"hi-hat",   c:"#F3EEE4"},
  {k:"plas", n:"PLAS", d:"palmas",   c:"#ff3fa4"},
  {k:"dum",  n:"DUM",  d:"bajo",     c:"#4d8bff"},
  {k:"chk",  n:"CHK",  d:"shaker",   c:"#19c26a"},
  {k:"tonk", n:"TONK", d:"cencerro", c:"#f5a300"},
  {k:"taka", n:"TaKá", d:"lata",     c:"#ff6a3d"}
];
const IK=Object.fromEntries(INST.map(i=>[i.k,i]));
const PCOL=["#F7C600","#E32636","#4d8bff","#19c26a","#ff3fa4","#f5a300","#F3EEE4","#a66bff"];
const $=id=>document.getElementById(id);
const uid=Math.random().toString(36).slice(2,10);
const joined=Date.now()+Math.random();

/* ---------------- acceso ---------------- */
const hashCode=(location.hash.slice(1).match(/^[A-Za-z]{4}$/)||[])[0];
let unlocked=false; try{ unlocked=sessionStorage.getItem("bk_secret")==="1"; }catch(_){}
if(hashCode){ unlocked=true; try{ sessionStorage.setItem("bk_secret","1"); }catch(_){} }

/* ---------------- estado ---------------- */
function emptyPattern(){ const p={}; INST.forEach(i=>p[i.k]=Array(STEPS).fill(0)); return p; }
function seedPattern(){ const p=emptyPattern(); [0,6,8,11].forEach(s=>p.bum[s]=1); [4,12].forEach(s=>p.tak[s]=1); for(let s=0;s<STEPS;s+=2) p.tss[s]=1; [3,15].forEach(s=>p.taka[s]=1); return p; }
const S={ mode:null, code:null, bpm:100, playing:false, startAt:0, pattern:seedPattern(), mine:null, offset:0, peers:{} };
let ch=null, sb=null;
const roomNow=()=>Date.now()+S.offset;
const stepMs=()=>60000/S.bpm/4;

/* ---------------- audio ---------------- */
let AC=null, master=null, NB=null;
function audio(){ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=0.85;
  const comp=AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate); const d=NB.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  if(AC.state==="suspended") AC.resume(); return AC; }
function env(g,t,a,v,dur){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); }
function osc(t,type,f0,f1,dur,v){ const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f0,t); if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  env(g,t,0.003,v,dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.05); return o; }
function noise(t,type,f,q,dur,v,a){ const n=AC.createBufferSource(); n.buffer=NB; const fl=AC.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q||1;
  const g=AC.createGain(); env(g,t,a||0.002,v,dur); n.connect(fl); fl.connect(g); g.connect(master); n.start(t,Math.random()*0.5); n.stop(t+dur+0.05); }
const BASS=[45,45,57,45,52,45,43,45,45,45,57,45,55,52,48,43];   // notas MIDI (La menor)
const mtof=m=>440*Math.pow(2,(m-69)/12);
const SYN={
  bum:(t)=>{ osc(t,"sine",160,42,0.45,1.0); noise(t,"lowpass",900,1,0.02,0.3); },
  tak:(t)=>{ osc(t,"triangle",220,140,0.12,0.5); noise(t,"bandpass",1900,0.8,0.18,0.7); },
  tss:(t)=>{ noise(t,"highpass",8000,1,0.05,0.35); },
  plas:(t)=>{ for(let i=0;i<3;i++) noise(t+i*0.011,"bandpass",1300,1.2,0.03,0.6); noise(t+0.033,"bandpass",1300,1.2,0.18,0.5); },
  dum:(t,s)=>{ const f=mtof(BASS[(s??0)%STEPS]); const o=AC.createOscillator(), fl=AC.createBiquadFilter(), g=AC.createGain();
    o.type="sawtooth"; o.frequency.value=f; fl.type="lowpass"; fl.Q.value=8; fl.frequency.setValueAtTime(1400,t); fl.frequency.exponentialRampToValueAtTime(180,t+0.22);
    env(g,t,0.005,0.5,0.32); o.connect(fl); fl.connect(g); g.connect(master); o.start(t); o.stop(t+0.4); },
  chk:(t)=>{ noise(t,"bandpass",5500,1.5,0.09,0.35,0.02); },
  tonk:(t)=>{ const g=AC.createGain(), bp=AC.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=800; bp.Q.value=2; env(g,t,0.002,0.35,0.35);
    [540,800].forEach(f=>{ const o=AC.createOscillator(); o.type="square"; o.frequency.value=f; o.connect(bp); o.start(t); o.stop(t+0.4); }); bp.connect(g); g.connect(master); },
  taka:(t)=>{ const h=(tt,f,dur,br,v)=>{ osc(tt,"triangle",f,f*0.55,dur,v); noise(tt,"bandpass",br,1.4,0.05,v*0.9); };
    h(t,820,0.09,3800,0.45); h(t+0.085,520,0.13,2200,0.55); }
};
function play(k,t,s){ audio(); try{ SYN[k](t??AC.currentTime,s); }catch(e){} }

/* ---------------- secuenciador (lookahead) ---------------- */
let timer=null, lastStep=-1, uiStep=-1;
function sched(){
  if(!S.playing||!AC) return;
  const now=roomNow(), ms=stepMs(), ahead=140;
  let n=Math.max(lastStep+1, Math.floor((now-S.startAt)/ms));
  for(;;){ const at=S.startAt+n*ms; if(at>now+ahead) break;
    if(at>=now-30){ const s=((n%STEPS)+STEPS)%STEPS, t=AC.currentTime+Math.max(0,(at-now)/1000);
      for(const i of INST) if(S.pattern[i.k][s]) play(i.k,t,s);
      setTimeout(()=>showStep(s), Math.max(0,at-now)); }
    lastStep=n; n++; }
}
function startClock(){ audio(); lastStep=Math.floor((roomNow()-S.startAt)/stepMs())-1; clearInterval(timer); timer=setInterval(sched,25); sched(); }
function stopClock(){ clearInterval(timer); timer=null; showStep(-1); }

/* ---------------- UI ---------------- */
function takenBy(k){ for(const id in S.peers){ if(id!==uid && S.peers[id].inst===k) return S.peers[id]; } return null; }
function peerColor(id){ const ids=Object.keys(S.peers).sort((a,b)=>S.peers[a].joined-S.peers[b].joined); return PCOL[Math.max(0,ids.indexOf(id))%PCOL.length]; }
function renderInsts(){
  $("insts").innerHTML=INST.map(i=>{ const t=S.mode==="multi"?takenBy(i.k):null;
    const who=t?Object.keys(S.peers).find(id=>S.peers[id]===t):null;
    return `<button type="button" class="inst${S.mine===i.k?" me":""}${t?" taken":""}" data-k="${i.k}" style="--c:${i.c}${who?`;--who:${peerColor(who)}`:""}" ${t?'aria-disabled="true"':""} aria-pressed="${S.mine===i.k}">${i.n}<small>${S.mine===i.k?"TÚ":i.d}</small></button>`; }).join("");
}
function renderPad(){ const p=$("pad"); if(S.mine){ p.disabled=false; p.textContent=IK[S.mine].n; p.style.setProperty("--c",IK[S.mine].c); } else { p.disabled=true; p.textContent="TaKá?"; } }
function renderGrid(){
  const k=S.mine, row=k?S.pattern[k]:Array(STEPS).fill(0);
  $("rowLabel").textContent = k ? `3 · ${IK[k].n} × 16` : "3 · TaKá × 16";
  $("grid").innerHTML=row.map((v,s)=>`<button type="button" class="cell${v?" on":""}${s%4===0?" q":""}" data-s="${s}" style="--c:${k?IK[k].c:"#fff"}" ${k?"":"disabled"} aria-label="Paso ${s+1}" aria-pressed="${!!v}"></button>`).join("");
}
function renderMini(){
  $("mini").innerHTML=INST.map(i=>`<div class="mrow" style="--c:${i.c}"><span>${i.n}</span>${S.pattern[i.k].map((v,s)=>`<i class="${v?"on":""}" data-s="${s}"></i>`).join("")}</div>`).join("");
}
function renderTransport(){ $("play").classList.toggle("on",S.playing); $("play").textContent=S.playing?"■ TaKá":"▶ TaKá"; $("bpm").textContent=S.bpm; }
function renderPeople(){ if(S.mode!=="multi"){ $("people").innerHTML=""; return; }
  $("people").innerHTML=Object.keys(S.peers).sort((a,b)=>S.peers[a].joined-S.peers[b].joined).map(id=>`<i style="background:${peerColor(id)}" title="${S.peers[id].inst?IK[S.peers[id].inst].n:"?"}"></i>`).join(""); }
function renderAll(){ renderInsts(); renderPad(); renderGrid(); renderMini(); renderTransport(); renderPeople(); }
function showStep(s){ if(s===uiStep) return; uiStep=s;
  document.querySelectorAll(".cell.now,.mrow i.now").forEach(e=>e.classList.remove("now"));
  if(s<0) return; const c=$("grid").children[s]; if(c) c.classList.add("now");
  document.querySelectorAll(`.mrow i[data-s="${s}"]`).forEach(e=>e.classList.add("now")); }
let toastT=null; function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"),1800); }

/* ---------------- interacción ---------------- */
$("insts").addEventListener("click",e=>{ const b=e.target.closest(".inst"); if(!b) return; audio(); const k=b.dataset.k;
  if(S.mode==="multi" && takenBy(k)){ toast(`${IK[k].n} → TaKá ocupado`); return; }
  S.mine = S.mine===k && S.mode==="multi" ? null : k; play(k);
  if(ch) ch.track({uid, inst:S.mine, joined});
  renderAll(); });
const pad=$("pad");
pad.addEventListener("pointerdown",e=>{ if(!S.mine) return; e.preventDefault(); play(S.mine,null,uiStep<0?0:uiStep); pad.classList.add("hit");
  if(navigator.vibrate) try{navigator.vibrate(10)}catch(_){}
  if(ch) ch.send({type:"broadcast",event:"hit",payload:{k:S.mine,s:uiStep}}); });
["pointerup","pointercancel","pointerleave"].forEach(ev=>pad.addEventListener(ev,()=>pad.classList.remove("hit")));
$("grid").addEventListener("click",e=>{ const b=e.target.closest(".cell"); if(!b||!S.mine) return; const s=+b.dataset.s, v=S.pattern[S.mine][s]?0:1;
  S.pattern[S.mine][s]=v; if(v && !S.playing) play(S.mine,null,s); renderGrid(); renderMini();
  if(ch) ch.send({type:"broadcast",event:"step",payload:{k:S.mine,s,v}}); });
$("clear").addEventListener("click",()=>{ if(!S.mine) return; S.pattern[S.mine]=Array(STEPS).fill(0); renderGrid(); renderMini();
  if(ch) ch.send({type:"broadcast",event:"row",payload:{k:S.mine,row:S.pattern[S.mine]}}); });
function setTransport(playing,bpm){ S.bpm=Math.max(60,Math.min(180,bpm)); S.playing=playing; S.startAt=roomNow()+60;
  if(playing) startClock(); else stopClock(); renderTransport();
  if(ch) ch.send({type:"broadcast",event:"transport",payload:{playing:S.playing,bpm:S.bpm,startAt:S.startAt}}); }
$("play").addEventListener("click",()=>{ audio(); setTransport(!S.playing,S.bpm); });
$("bpmDown").addEventListener("click",()=>setTransport(S.playing,S.bpm-5));
$("bpmUp").addEventListener("click",()=>setTransport(S.playing,S.bpm+5));
$("share").addEventListener("click",async()=>{ const url=`${location.origin}${location.pathname}#${S.code}`;
  const txt=`TaKáTaKá!!! SALA ${S.code} → ${url}`;
  if(navigator.share){ try{ await navigator.share({title:"Sala TaKá",text:txt,url}); return; }catch(_){ } }
  window.open(`https://api.whatsapp.com/send/?text=${encodeURIComponent(txt)}`,"_blank","noopener"); });

/* ---------------- sala en tiempo real ---------------- */
function newCode(){ const A="ABCDEFGHJKLMNPQRSTUVWXYZ"; let c=""; for(let i=0;i<4;i++) c+=A[Math.floor(Math.random()*A.length)]; return c; }
function leaderId(){ const ids=Object.keys(S.peers); if(!ids.length) return uid; return ids.sort((a,b)=>S.peers[a].joined-S.peers[b].joined)[0]; }
function enterSolo(){ S.mode="solo"; S.mine="bum"; show("room"); renderAll(); }
function enterRoom(code, creating){
  if(!window.supabase){ $("err").textContent="TaKá…? sin conexión → SOLO"; return; }
  S.mode="multi"; S.code=code.toUpperCase(); history.replaceState(null,"","#"+S.code);
  if(!creating) S.pattern=emptyPattern();   // se recibe el patrón de la sala
  sb=sb||window.supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:30}}});
  ch=sb.channel("sala-"+S.code,{config:{broadcast:{self:false},presence:{key:uid}}});
  let gotState=creating, helloAt=0;
  ch.on("broadcast",{event:"hit"},({payload})=>{ if(IK[payload.k]) play(payload.k,null,payload.s<0?0:payload.s); })
    .on("broadcast",{event:"step"},({payload})=>{ if(IK[payload.k]){ S.pattern[payload.k][payload.s]=payload.v?1:0; if(payload.k===S.mine) renderGrid(); renderMini(); } })
    .on("broadcast",{event:"row"},({payload})=>{ if(IK[payload.k]){ S.pattern[payload.k]=payload.row.slice(0,STEPS); if(payload.k===S.mine) renderGrid(); renderMini(); } })
    .on("broadcast",{event:"transport"},({payload})=>{ S.bpm=payload.bpm; S.playing=payload.playing; S.startAt=payload.startAt; if(S.playing) startClock(); else stopClock(); renderTransport(); })
    .on("broadcast",{event:"hello"},({payload})=>{ if(leaderId()===uid) ch.send({type:"broadcast",event:"state",payload:{to:payload.from, t0:payload.t0, now:roomNow(), bpm:S.bpm, playing:S.playing, startAt:S.startAt, pattern:S.pattern}}); })
    .on("broadcast",{event:"state"},({payload})=>{ if(payload.to!==uid||gotState) return; gotState=true;
      const t1=Date.now(); S.offset=payload.now-(payload.t0+t1)/2+ (S.offset*0); // estimación por ida y vuelta
      S.pattern=Object.assign(emptyPattern(),payload.pattern); S.bpm=payload.bpm; S.playing=payload.playing; S.startAt=payload.startAt;
      if(S.playing) startClock(); renderAll(); })
    .on("presence",{event:"sync"},()=>{ const st=ch.presenceState(); S.peers={};
      for(const key in st){ const m=st[key][0]; if(m) S.peers[m.uid]={inst:m.inst||null, joined:m.joined}; }
      // conflicto de instrumento: gana quien entró primero
      if(S.mine){ const t=takenBy(S.mine); if(t && t.joined<joined){ toast(`${IK[S.mine].n} → TaKá ocupado`); S.mine=null; ch.track({uid,inst:null,joined}); } }
      renderAll(); })
    .subscribe(async status=>{
      if(status==="SUBSCRIBED"){ await ch.track({uid, inst:S.mine, joined});
        if(!creating){ const ask=()=>{ if(gotState) return; helloAt=Date.now(); ch.send({type:"broadcast",event:"hello",payload:{from:uid,t0:helloAt}}); };
          ask(); setTimeout(ask,1200); setTimeout(()=>{ if(!gotState && Object.keys(S.peers).length<=1){ gotState=true; S.pattern=seedPattern(); renderAll(); } },2600); }
        toast(creating?`SALA ${S.code} · + AMIGOS →`:`SALA ${S.code} · TaKá!`); }
      else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){ toast("TaKá…? reconectando"); }
    });
  $("codeTxt").textContent=S.code; $("codeChip").hidden=false; $("share").hidden=false;
  show("room"); renderAll();
}
function show(id){ ["locked","lobby","room"].forEach(x=>$(x).hidden=x!==id); window.scrollTo(0,0); }

$("create").addEventListener("click",()=>{ audio(); enterRoom(newCode(),true); });
$("solo").addEventListener("click",()=>{ audio(); enterSolo(); });
function tryJoin(){ const c=$("code").value.trim().toUpperCase(); if(!/^[A-Z]{4}$/.test(c)){ $("err").textContent="TaKá? → 4 letras"; return; } audio(); enterRoom(c,false); }
$("joinBtn").addEventListener("click",tryJoin);
$("code").addEventListener("keydown",e=>{ if(e.key==="Enter") tryJoin(); });
$("code").addEventListener("input",e=>{ e.target.value=e.target.value.toUpperCase().replace(/[^A-Z]/g,""); $("err").textContent=""; });

if(!unlocked) show("locked");
else if(hashCode) enterRoom(hashCode,false);
else show("lobby");
</script>
</body></html>
