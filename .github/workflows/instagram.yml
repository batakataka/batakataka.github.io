name: Instagram Bataka

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "check = probar token | publish = publicar lo aprobado"
        required: true
        default: check
        type: choice
        options: [check, publish]

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  ig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/ig_publish.py ${{ inputs.modo || 'publish' }}
      - name: Guardar registro
        run: |
          if [ -f ig/published.json ] && [ -n "$(git status --porcelain ig/published.json)" ]; then
            git config user.name "bataka-bot"
            git config user.email "bataka-bot@users.noreply.github.com"
            git add ig/published.json
            git commit -m "IG: registro de publicacion"
            git push
          fi
