<style>
/* Layout: pantalla de juego a todo lo alto, partida en dos mitades de color (piña | cereza); HUD arriba y escalera de descuentos abajo; carrito como hoja que sube. Un solo look deliberado (no cambia con el tema). */
:root{
  --pina:#f5a300; --pina-deep:#7a3d00;
  --cereza:#d0102a; --cereza-deep:#4a0010;
  --ink:#140d08; --paper:#fff8ec; --chalk:#ffffffcc; --shade:#00000059;
  --display:"Permanent Marker","Marker Felt","Comic Sans MS",cursive;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1fr}
#stage .half{position:relative}
#stage .pina{background:radial-gradient(120% 70% at 70% 45%,var(--pina) 0%,#d97800 45%,var(--pina-deep) 100%)}
#stage .cereza{background:radial-gradient(120% 70% at 30% 45%,#ff2a45 0%,var(--cereza) 40%,var(--cereza-deep) 100%)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer;-webkit-touch-callout:none}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}

header.hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.brand{font-family:var(--display);font-size:clamp(28px,6vw,44px);line-height:1;color:var(--ink);
  text-shadow:0 2px 0 #ffffff55;transform:rotate(-4deg)}
.cartbtn{pointer-events:auto;display:flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
  font:800 15px/1 var(--body);padding:10px 14px;border-radius:999px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.cartbtn:focus-visible,.btn:focus-visible,.snd:focus-visible,.cta:focus-visible,.x:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hud-r{display:flex;align-items:center;gap:8px}
.snd{pointer-events:auto;width:42px;height:42px;display:grid;place-items:center;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:50%;cursor:pointer;box-shadow:0 3px 0 var(--ink);padding:0}
.snd svg{width:20px;height:20px}
.snd .off{display:none}.snd[aria-pressed="true"] .on{display:none}.snd[aria-pressed="true"] .off{display:block}
.cartbtn .carticon{flex:none;display:block}
.cartbtn .count{font-family:var(--num);font-size:18px;min-width:1.4em;text-align:center;background:var(--ink);color:var(--paper);border-radius:999px;padding:3px 7px}
.cartbtn.bump{animation:bump .25s ease}
@keyframes bump{50%{transform:scale(1.15)}}

.labels{position:fixed;left:0;right:0;bottom:calc(var(--lab-b,calc(env(safe-area-inset-bottom,0px) + 106px)) + 6px);display:grid;grid-template-columns:1fr 1fr;
  transition:bottom .3s cubic-bezier(.2,.8,.3,1);pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lab{text-align:center}
.lab .name{font-family:var(--display);font-size:clamp(22px,5vw,32px);line-height:1.05;color:var(--ink)}
.lab .taps{font:800 13px/1.2 var(--num);letter-spacing:.12em;text-transform:uppercase;color:#000000b0}
.lab .meter{height:6px;width:min(140px,60%);margin:6px auto 0;background:#00000033;border-radius:9px;overflow:hidden}
.lab .meter i{display:block;height:100%;width:0;background:var(--ink);border-radius:9px;transition:width .15s}

footer.ladder{position:fixed;left:0;right:0;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding-top:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(to top,#000000a6,#00000000)}
.ladder .hint{text-align:center;font:600 14px/1.3 var(--body);color:var(--chalk);margin-bottom:10px;min-height:1.3em}
.ladder .hint b{color:#fff}
.track{position:relative;height:10px;background:#ffffff2e;border-radius:9px;max-width:560px;margin:0 auto}
.track .fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:9px;background:linear-gradient(90deg,var(--pina),#ff5a2a,var(--cereza));transition:width .2s}
.steps{position:relative;max-width:560px;margin:8px auto 0;height:34px}
.step{position:absolute;transform:translateX(-50%);text-align:center;font:800 12px/1.15 var(--num);letter-spacing:.06em;color:#ffffff80;white-space:nowrap}
.step b{display:block;font-size:17px;letter-spacing:0}
.step.on{color:#fff}
.step.boom b{font-family:var(--display);font-weight:400;font-size:13px}
.step.last{transform:translateX(-100%);text-align:right}
.step.on b{animation:stepOn .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stepOn{0%{transform:scale(.6)}60%{transform:scale(1.35)}100%{transform:none}}

/* botón de pedido: aparece con la primera lata */
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;max-width:560px;box-sizing:border-box;margin:0 auto;
  border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);
  font:800 17px/1.1 var(--body);padding:0 18px;cursor:pointer;text-align:left;
  max-height:0;opacity:0;overflow:hidden;border-width:0;box-shadow:none;transform:translateY(10px);pointer-events:none;
  transition:max-height .35s cubic-bezier(.2,.8,.3,1),opacity .25s,transform .35s cubic-bezier(.2,1.4,.4,1),margin .35s,padding .35s}
.cta.on{max-height:80px;opacity:1;transform:none;pointer-events:auto;margin-top:12px;padding:14px 18px;border-width:2px;box-shadow:0 4px 0 var(--ink)}
.cta .l{display:flex;align-items:center;gap:10px}
.cta .l svg{flex:none;width:22px;height:22px}
.cta .r{font:800 20px/1 var(--num);white-space:nowrap;font-variant-numeric:tabular-nums}
.cta .r s{font-weight:600;font-size:15px;opacity:.55;margin-right:4px}
.cta.boom{background:var(--ink);color:var(--paper);border-color:var(--paper);box-shadow:0 4px 0 #000}
.cta.pulse{animation:ctaPulse .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes ctaPulse{40%{transform:scale(1.05) rotate(-1deg)}}

/* guía del primer toque */
.coach{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .35s}
.coach.on{opacity:1}
.coach .ring{position:absolute;left:-30px;top:-30px;width:60px;height:60px;border-radius:50%;border:3px solid #fff;box-sizing:border-box;opacity:0;animation:coachRing 1.6s infinite}
.coach .mano{position:absolute;left:-23px;top:-3px;width:50px;height:50px;transform-origin:23px 3px;animation:coachTap 1.6s infinite;filter:drop-shadow(0 3px 0 #0007)}
.coach .globo{position:absolute;left:0;top:-58px;transform:translateX(-50%);background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);
  font:800 15px/1.2 var(--body);padding:8px 12px;border-radius:14px;white-space:nowrap}
.coach .globo b{font-family:var(--display);font-weight:400;font-size:17px}
.coach.hold .mano{animation:coachHold 2.4s infinite}
.coach.hold .ring{animation:coachRingHold 2.4s infinite}
@keyframes coachTap{0%,100%{transform:translate(6px,18px)}22%{transform:none}30%{transform:scale(.88)}40%{transform:none}52%{transform:scale(.88)}62%{transform:none}80%{transform:translate(6px,18px)}}
@keyframes coachRing{0%,25%{opacity:0;transform:scale(.3)}30%{opacity:.95;transform:scale(.45)}50%{opacity:0;transform:scale(1.4)}52%{opacity:.95;transform:scale(.45)}75%,100%{opacity:0;transform:scale(1.4)}}
@keyframes coachHold{0%,100%{transform:translate(6px,18px)}15%{transform:none}22%,78%{transform:scale(.86)}88%{transform:none}}
@keyframes coachRingHold{0%,20%{opacity:0;transform:scale(.3)}25%{opacity:.95;transform:scale(.4)}40%{opacity:0;transform:scale(1.2)}41%{opacity:.95;transform:scale(.4)}56%{opacity:0;transform:scale(1.3)}57%{opacity:.95;transform:scale(.4)}72%{opacity:0;transform:scale(1.5)}100%{opacity:0}}
.big{position:fixed;left:50%;top:40%;z-index:4;pointer-events:none;text-align:center;font-family:var(--display);color:#fff;line-height:.95;
  text-shadow:0 4px 0 var(--ink),0 0 24px #0009;transform:translate(-50%,-50%)}
.big b{display:block;font-weight:400;font-size:clamp(64px,17vw,150px)}
.big small{display:block;font-size:clamp(20px,4.6vw,30px)}

.pop{position:fixed;font-family:var(--display);font-size:clamp(26px,6vw,40px);color:#fff;pointer-events:none;
  text-shadow:0 3px 0 var(--ink),0 0 18px #0008;transform:translate(-50%,-50%);will-change:transform,opacity}

#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:28px;color:var(--ink);pointer-events:none}
#loading .ld{display:grid;justify-items:center;gap:12px}
#loading .bar{width:170px;height:6px;background:#00000033;border-radius:9px;overflow:hidden}
#loading .bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:9px;transition:width .2s}
#loading small{font:800 14px/1 var(--num);letter-spacing:.14em}

/* carrito */
#sheet{position:fixed;inset:0;display:grid;align-items:end;background:#000000a0;opacity:0;pointer-events:none;transition:opacity .25s}
#sheet.open{opacity:1;pointer-events:auto}
.card{position:relative;background:var(--paper);color:var(--ink);border-radius:22px 22px 0 0;max-width:560px;width:100%;margin:0 auto;
  padding-top:22px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 22px);padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  transform:translateY(40px);transition:transform .35s cubic-bezier(.2,1.4,.4,1);box-sizing:border-box}
#sheet.open .card{transform:none}
.card h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0 0 2px;text-wrap:balance}
.card .sub{margin:0 0 16px;color:#5a4a3a;font-size:14px}
.x{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:transparent;color:var(--ink);font:800 20px/1 var(--body);cursor:pointer;display:grid;place-items:center;padding:0}
.up{margin:10px 0 0;font:600 14px/1.35 var(--body);color:#5a4a3a}
.up b{color:var(--ink)}
.badge{display:inline-block;font:800 13px/1 var(--num);letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:7px 10px;border-radius:999px;margin-bottom:12px}
.rows{display:grid;gap:10px;margin-bottom:14px}
.row{display:grid;grid-template-columns:18px 1fr auto auto;gap:10px;align-items:center;font-size:16px}
.row .dot{width:18px;height:18px;border-radius:50%;box-shadow:0 0 0 2px #0002 inset}
.row .q{font:800 17px var(--num);font-variant-numeric:tabular-nums}
.row .p{font:600 17px var(--num);font-variant-numeric:tabular-nums;min-width:70px;text-align:right}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);background:transparent;color:var(--ink);font:800 16px var(--body);cursor:pointer}
.tot{border-top:2px dashed #14130f40;padding-top:12px;display:grid;gap:6px;font:600 16px var(--num);font-variant-numeric:tabular-nums}
.tot div{display:flex;justify-content:space-between}
.tot .disc{color:#b0101f}
.tot .grand{font-size:24px;font-weight:800}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{flex:1 1 140px;text-align:center;text-decoration:none;box-sizing:border-box;border:2px solid var(--ink);border-radius:14px;padding:14px;font:800 16px var(--body);cursor:pointer;background:transparent;color:var(--ink)}
.btn.main{flex:2 1 200px;background:var(--ink);color:var(--paper);box-shadow:0 3px 0 #000;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.main svg{width:20px;height:20px;flex:none}
.note{font-size:12.5px;color:#6b5a48;margin:12px 0 0;min-height:1em}
@media (prefers-reduced-motion:reduce){.card,.cta,.labels{transition:none}.cartbtn.bump,.cta.pulse,.step.on b,.coach .mano,.coach .ring{animation:none}}
</style>

/* ---------------- audio: "ta-ka" sintetizado ---------------- */
let AC=null, master=null, muted=false;
try{ muted=localStorage.getItem("bk_mute")==="1"; }catch(_){}
function audio(){ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=muted?0:0.9;
  const comp=AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);} if(AC.state==="suspended") AC.resume(); return AC; }
function noiseBuf(sec){ const b=AC.createBuffer(1,AC.sampleRate*sec,AC.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; }
function hit(t, f, dur, bright, gain){
  const o=AC.createOscillator(), g=AC.createGain(); o.type="triangle"; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*0.55,t+dur);
  g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);
  const n=AC.createBufferSource(); n.buffer=noiseBuf(0.08); const bp=AC.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=bright; bp.Q.value=1.4;
  const ng=AC.createGain(); ng.gain.setValueAtTime(gain*0.9,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.05); n.connect(bp); bp.connect(ng); ng.connect(master); n.start(t);
}
function taka(level){ audio(); const t=AC.currentTime, up=1+level*0.025;
  hit(t, 820*up, 0.09, 3800*up, 0.55);          // "ta"
  hit(t+0.085, 520*up, 0.13, 2200*up, 0.7);     // "ka"
}
function ding(n){ audio(); const t=AC.currentTime;              // escalón de descuento desbloqueado
  [0,0.09,0.18].slice(0,n+1).forEach((d,i)=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type="square"; o.frequency.value=[660,880,1320][i];
    g.gain.setValueAtTime(0.0001,t+d); g.gain.exponentialRampToValueAtTime(0.22,t+d+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.16);
    o.connect(g); g.connect(master); o.start(t+d); o.stop(t+d+0.2); }); }
function boom(){ audio(); const t=AC.currentTime;
  const o=AC.createOscillator(), g=AC.createGain(); o.type="sine"; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(32,t+0.9);
  g.gain.setValueAtTime(1.0,t); g.gain.exponentialRampToValueAtTime(0.0001,t+1.2); o.connect(g); g.connect(master); o.start(t); o.stop(t+1.3);
  const n=AC.createBufferSource(); n.buffer=noiseBuf(1.6); const lp=AC.createBiquadFilter(); lp.type="lowpass"; lp.frequency.setValueAtTime(5000,t); lp.frequency.exponentialRampToValueAtTime(300,t+1.2);
  const ng=AC.createGain(); ng.gain.setValueAtTime(0.9,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+1.5); n.connect(lp); lp.connect(ng); ng.connect(master); n.start(t);
  for(let i=0;i<70;i++){ const tt=t+0.25+Math.random()*1.3, s=AC.createBufferSource(); s.buffer=noiseBuf(0.02); const hp=AC.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=4000;
    const sg=AC.createGain(); sg.gain.setValueAtTime(0.12*Math.random(),tt); sg.gain.exponentialRampToValueAtTime(0.0001,tt+0.02); s.connect(hp); hp.connect(sg); sg.connect(master); s.start(tt); }
}

const loader=new THREE.GLTFLoader();
/* El modelo viene como JSON {gltf, bin(base64)}: se arma un GLB en memoria y se parsea sin pedir
   data:/blob: por red (el visor solo permite cargar archivos propios). La etiqueta se carga aparte como imagen. */
function toGLB(gltf, bin){
  const enc=new TextEncoder(); let js=enc.encode(JSON.stringify(gltf)); const jp=(4-js.length%4)%4, bp=(4-bin.length%4)%4;
  const total=12+8+js.length+jp+8+bin.length+bp, out=new Uint8Array(total), dv=new DataView(out.buffer);
  dv.setUint32(0,0x46546C67,true); dv.setUint32(4,2,true); dv.setUint32(8,total,true);
  dv.setUint32(12,js.length+jp,true); dv.setUint32(16,0x4E4F534A,true); out.set(js,20); out.fill(0x20,20+js.length,20+js.length+jp);
  let o=20+js.length+jp; dv.setUint32(o,bin.length+bp,true); dv.setUint32(o+4,0x004E4942,true); out.set(bin,o+8);
  return out.buffer;
}
function loadTex(url){ return new Promise((res,rej)=>new THREE.TextureLoader().load(url,t=>{ t.flipY=false; t.encoding=THREE.sRGBEncoding;
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=renderer.capabilities.getMaxAnisotropy(); res(t); },undefined,rej)); }
const bajado={};
function showLoad(){ let got=0, tot=0; for(const k in FLAV){ tot+=FLAV[k].peso; got+=Math.min(bajado[k]||0,FLAV[k].peso); }
  const p=Math.min(99,Math.round(got/tot*100)); const b=document.getElementById("loadBar"), t=document.getElementById("loadPct");
  if(b) b.style.width=p+"%"; if(t) t.textContent=p+"%"; }
async function getModel(id){                 // lee el modelo por partes para mostrar el avance
  const r=await fetch(FLAV[id].glb); if(!r.ok) throw new Error(r.status);
  if(!r.body||!r.body.getReader||!window.TextDecoder) return r.json();
  const rd=r.body.getReader(), parts=[]; let n=0;
  for(;;){ const {done,value}=await rd.read(); if(done) break; parts.push(value); n+=value.length; bajado[id]=n; showLoad(); }
  const all=new Uint8Array(n); let o=0; for(const q of parts){ all.set(q,o); o+=q.length; }
  return JSON.parse(new TextDecoder().decode(all));
}
async function loadCan(id){
  const [data, tex] = await Promise.all([getModel(id), loadTex(FLAV[id].tex)]);
  const raw=atob(data.bin), bin=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++) bin[i]=raw.charCodeAt(i);
  const g=await new Promise((res,rej)=>loader.parse(toGLB(data.gltf,bin),"",res,rej));
  const root=new THREE.Group(), tiltG=new THREE.Group(), spin=new THREE.Group();
  const m=g.scene; m.position.y=-0.084;   // centro de la lata en el pivote
  m.traverse(o=>{ if(o.isMesh){ o.userData.flav=id; pickables.push(o);
    const mats=Array.isArray(o.material)?o.material:[o.material];
    mats.forEach(mt=>{ if(mt && /^Etiqueta/.test(mt.name)){ mt.map=tex; mt.color.set(0xffffff); mt.needsUpdate=true; } }); } });
  spin.add(m); tiltG.add(spin); root.add(tiltG); tiltG.rotation.z=FLAV[id].tilt; tiltG.rotation.x=0.08;
  scene.add(root);
  cans[id]={root,tiltG,spin,mesh:m,scale:1,target:1,wob:0,alive:true,speed:1.1,phase:id==="pina"?0:Math.PI};
}

function layout(){
  const w=innerWidth, h=innerHeight; renderer.setSize(w,h,false); cam.aspect=w/h;
  // encajar dos latas (ancho ~0.30 m) y alto ~0.30 m; en vertical sobra alto, así que van un poco más grandes
  const port=cam.aspect<0.8;
  const needW=port?0.34:0.37, needH=0.36, vfov=THREE.MathUtils.degToRad(cam.fov);
  const dH=(needH/2)/Math.tan(vfov/2), dW=(needW/2)/(Math.tan(vfov/2)*cam.aspect);
  cam.position.set(0,0.012,Math.max(dH,dW)); cam.lookAt(0,0.0,0);
  // subir las latas al centro del espacio libre entre la barra de arriba y los controles de abajo
  const top=document.querySelector("header.hud").offsetHeight, foot=document.querySelector("footer.ladder"), labs=document.querySelector(".labels");
  const cta=document.getElementById("cta"), ctaH=cta.classList.contains("on")?0:64;
  const bot=foot.offsetHeight+labs.offsetHeight+ctaH;
  const dy=Math.max(0,(bot-top)/2)*(port?1:0.45);
  cam.setViewOffset(w,h,0,Math.round(dy),w,h);
  cam.updateProjectionMatrix();
}

function popText(x,y,txt){ const el=document.createElement("div"); el.className="pop"; el.textContent=txt; el.style.left=x+"px"; el.style.top=y+"px"; document.body.appendChild(el);

/* ---------------- toques ---------------- */
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
/* Toque = 1 TaKá. Mantener presionado = TaKá automático cada vez más rápido hasta el BOOM.
   Multitouch: cada dedo mantiene su lata. Si las DOS revientan manteniendo casi a la vez → sala secreta. */
const holds=new Map();                      // pointerId → {id,x,y,next,n,hum}
const HOLD_DELAY=280, DUO_WINDOW=2500;      // ms antes de la ráfaga · ventana para el doble BOOM
canvas.addEventListener("contextmenu",e=>e.preventDefault());
canvas.addEventListener("pointerdown",e=>{
  hideCoach();
  ptr.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(ptr,cam);
  const hit=ray.intersectObjects(pickables.filter(o=>cans[o.userData.flav].alive),false)[0];
  const id = hit ? hit.object.userData.flav : (e.clientX < innerWidth/2 ? "pina" : "cereza");
  if(!cans[id]||!cans[id].alive||cans[id].busy) return;
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  for(const [pid,h] of holds) if(h.id===id) stopHold(pid);   // un dedo por lata
  stopHold(e.pointerId);
  tap(id, e.clientX, e.clientY);
  holds.set(e.pointerId,{id, x:e.clientX, y:e.clientY, next:performance.now()+HOLD_DELAY, n:0, hum:null});
});
canvas.addEventListener("pointermove",e=>{ const h=holds.get(e.pointerId); if(h){ h.x=e.clientX; h.y=e.clientY; } });
["pointerup","pointercancel","lostpointercapture"].forEach(ev=>canvas.addEventListener(ev,e=>stopHold(e.pointerId)));
addEventListener("blur",()=>{ for(const pid of [...holds.keys()]) stopHold(pid); });
function stopHold(pid){ const h=holds.get(pid); if(!h) return; holds.delete(pid);
  if(h.hum){ try{ const t=AC.currentTime; h.hum.g.gain.cancelScheduledValues(t); h.hum.g.gain.setTargetAtTime(0.0001,t,0.05); h.hum.o.stop(t+0.3); }catch(_){} } }
function humStart(id){ audio(); const o=AC.createOscillator(), f=AC.createBiquadFilter(), g=AC.createGain();
  o.type="sawtooth"; o.frequency.value=id==="pina"?70:82; f.type="lowpass"; f.frequency.value=600; f.Q.value=6;
  g.gain.setValueAtTime(0.0001,AC.currentTime); g.gain.exponentialRampToValueAtTime(0.14,AC.currentTime+0.15);
  o.connect(f); f.connect(g); g.connect(master); o.start(); return {o,f,g}; }
function holdTick(now){
  for(const [pid,h] of [...holds]){
    const c=cans[h.id];
    if(!c||!c.alive||c.busy){ stopHold(pid); continue; }
    c.wob=Math.max(c.wob,0.35+0.4*(state.taps[h.id]/CONFIG.explota));     // vibra mientras carga
    if(now<h.next) continue;
    if(!h.hum) h.hum=humStart(h.id);
    h.n++;
    const lvl=state.taps[h.id]/CONFIG.explota, base=h.id==="pina"?70:82;
    try{ const t=AC.currentTime; h.hum.o.frequency.setTargetAtTime(base+lvl*260,t,0.05); h.hum.f.frequency.setTargetAtTime(600+lvl*3400,t,0.05); }catch(_){}
    h.next=now+Math.max(55, 190*Math.pow(0.86,h.n));                      // cada vez más rápido
    tap(h.id, h.x+(Math.random()-.5)*40, h.y+(Math.random()-.5)*40, h.n);
  }
}
function tap(id,x,y,autoN){
  const c=cans[id]; state.taps[id]++; state.cart[id]++;
  taka(state.taps[id]); if(!autoN||autoN%2===1) popText(x,y,autoN?"TaKá":"TaKá!"); bumpCart();
  c.target=1+state.taps[id]*CONFIG.crece; c.wob=1; c.speed=Math.min(9,c.speed+0.45);
  if(navigator.vibrate) try{navigator.vibrate(12)}catch(_){}
  refreshHUD();
  if(state.taps[id]>=CONFIG.explota){ c.byHold=!!autoN; explode(id); }
}
setInterval(()=>holdTick(performance.now()),20);   // independiente de los FPS
/* doble BOOM manteniendo → sala secreta */
let secretGo=false;
function checkDuo(id){
  const c=cans[id], o=cans[id==="pina"?"cereza":"pina"];
  c.holdBoomAt = c.byHold ? performance.now() : 0;
  if(secretGo||!c.holdBoomAt||!o||!o.holdBoomAt) return;
  if(c.holdBoomAt-o.holdBoomAt<=DUO_WINDOW) secret();
}
function secret(){
  secretGo=true; for(const pid of [...holds.keys()]) stopHold(pid);
  try{ sessionStorage.setItem("bk_secret","1"); }catch(_){}
  const el=document.createElement("div"); el.className="pop"; el.textContent="TaKáTaKá!!!";
  Object.assign(el.style,{left:"50%",top:"45%",fontSize:"clamp(54px,14vw,120px)",zIndex:9});
  document.body.appendChild(el);
  el.animate([{transform:"translate(-50%,-50%) scale(.3) rotate(-8deg)"},{transform:"translate(-50%,-50%) scale(1.25) rotate(4deg)"},{transform:"translate(-50%,-50%) scale(1) rotate(-3deg)"}],{duration:600,easing:"cubic-bezier(.2,1.6,.4,1)",fill:"forwards"});
  $("flash").animate([{opacity:0},{opacity:1}],{duration:900,delay:500,fill:"forwards"});
  setTimeout(()=>{ location.href="secreto.html"+(ORIGEN!=="directo"?"?o="+ORIGEN:""); }, 1400);
}

/* ---------------- explosión ---------------- */
let bursts=[];
function explode(id){
  const c=cans[id]; if(c.busy) return; c.busy=true;
  setTimeout(()=>{
    state.exploded=true; state.booms++; c.alive=false; c.root.visible=false; boom(); refreshHUD(); checkDuo(id);
    $("flash").animate([{opacity:.9},{opacity:0}],{duration:450,easing:"ease-out"});
    const N=reduce?250:900, pos=new Float32Array(N*3), col=new Float32Array(N*3), vel=[];
    const base=new THREE.Color(FLAV[id].color), pal=[base, new THREE.Color(0xffffff), new THREE.Color(0x2a5cff), new THREE.Color(0x19c26a), new THREE.Color(0xff3fa4), new THREE.Color(0xfff200)];
    const o=new THREE.Vector3(); c.root.getWorldPosition(o);
    for(let i=0;i<N;i++){ pos.set([o.x,o.y,o.z],i*3); const k=pal[i%3===0?0:Math.floor(Math.random()*pal.length)]; col.set([k.r,k.g,k.b],i*3);
      const v=new THREE.Vector3().randomDirection().multiplyScalar(0.25+Math.random()*0.9); v.y+=0.25; vel.push(v); }
    const geo=new THREE.BufferGeometry(); geo.setAttribute("position",new THREE.BufferAttribute(pos,3)); geo.setAttribute("color",new THREE.BufferAttribute(col,3));
    const mat=new THREE.PointsMaterial({size:0.009,vertexColors:true,transparent:true,depthWrite:false});
    const pts=new THREE.Points(geo,mat); scene.add(pts);
    const ring=new THREE.Mesh(new THREE.RingGeometry(0.02,0.026,64), new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.7,side:THREE.DoubleSide}));
    ring.position.copy(o); scene.add(ring);
    bursts.push({pts,vel,ring,t:0});
    setTimeout(()=>respawn(id), reduce?300:650);
  }, 120);
}

function respawn(id){ const c=cans[id]; state.taps[id]=0; c.scale=0.05; c.target=1; c.speed=1.1; c.wob=1;
  c.alive=true; c.root.visible=true; c.busy=false; c.byHold=false; refreshHUD(); }

/* ---------------- carrito ---------------- */
function renderCart(){
  const rows=["pina","cereza"].filter(id=>state.cart[id]>0);
  $("rows").innerHTML = rows.length ? rows.map(id=>`<div class="row"><span class="dot" style="background:${FLAV[id].css}"></span><span>${FLAV[id].name} ${FLAV[id].sabor}</span>
    <span class="qty"><button type="button" data-id="${id}" data-d="-1" aria-label="Quitar una">−</button><span class="q">${state.cart[id]}</span><button type="button" data-id="${id}" data-d="1" aria-label="Agregar una">+</button></span>
    <span class="p">${money(state.cart[id]*CONFIG.precio)}</span></div>`).join("")
    : `<p style="margin:0;color:#6b5a48">Todavía no hay latas. Toca una para sumarla ↑</p>`;
  const sub=totalCans()*CONFIG.precio, pct=discountPct(), d=sub*pct/100;
  const sab=[state.cart.pina?`\u{1F34D}\u00D7${state.cart.pina}`:"", state.cart.cereza?`\u{1F352}\u00D7${state.cart.cereza}`:""].filter(Boolean).join(" ");
  const msg=`TaKá! BaTaKá? TaKá ${sab} → ${totalCans()} BaTaKáS TaKá ${money(sub-d)} · ${ORIGEN}`;
  $("pay").href=`https://api.whatsapp.com/send/?phone=${CONFIG.whatsapp}&text=${encodeURIComponent(msg)}&type=phone_number&app_absent=0`;
  $("subtotal").textContent=money(sub); $("discLabel").textContent=state.exploded?`TaKáBOOM −${pct}%`:`Descuento −${pct}%`; $("disc").textContent="−"+money(d); $("total").textContent=money(sub-d);
  $("discRow").hidden=!pct;
  $("badgeWrap").innerHTML = state.exploded ? `<span class="badge">TaKáBOOM! −${CONFIG.pctExplosion}%</span>` : pct ? `<span class="badge">TaKá! −${pct}%</span>` : "";
  $("cartSub").textContent = `${latas(totalCans())} de 500 ml · ${money(CONFIG.precio)} c/u`;
  const n=totalCans(), next=CONFIG.escalones.find(s=>n<s.latas);
  $("upsell").innerHTML = state.exploded || !n ? "" : next ? `Suma <b>${latas(next.latas-n)}</b> más y te llevas <b>−${next.pct}%</b>. O haz explotar una lata: <b>−${CONFIG.pctExplosion}%</b>.`
    : `Haz explotar una lata y el descuento sube a <b>−${CONFIG.pctExplosion}%</b>.`;
}
const NOTA="Te confirmamos disponibilidad, pago y entrega por WhatsApp. Pedidos en Quito. Solo para mayores de 18 años.";
$("rows").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; const id=b.dataset.id; state.cart[id]=Math.max(0,state.cart[id]+(+b.dataset.d)); renderCart(); refreshHUD(); });
let antesDelCarrito=null;
function openCart(){ renderCart(); $("note").textContent=NOTA; antesDelCarrito=document.activeElement; $("sheet").classList.add("open"); setTimeout(()=>$("pay").focus({preventScroll:true}),60); }
$("cartBtn").addEventListener("click",()=>{ audio(); openCart(); });
$("cta").addEventListener("click",()=>{ audio(); openCart(); });
$("sheet").addEventListener("click",e=>{ if(e.target.id==="sheet") closeCart(); });

addEventListener("keydown",e=>{ if(e.key==="Escape" && $("sheet").classList.contains("open")) closeCart(); });
function closeCart(){ $("sheet").classList.remove("open"); if(antesDelCarrito&&antesDelCarrito.focus) try{ antesDelCarrito.focus({preventScroll:true}); }catch(_){} }
$("again").addEventListener("click",()=>{ closeCart(); resetCans(); });
$("pay").addEventListener("click",e=>{ if(totalCans()===0){ e.preventDefault(); $("note").textContent="Toca una lata para sumarla a tu pedido ↑"; } else { $("note").textContent="TaKá! Abriendo WhatsApp… (+593 96 957 7774)";
    const sub=totalCans()*CONFIG.precio, pct=discountPct();
    logEvento({tipo:"pedido", pina:state.cart.pina, cereza:state.cart.cereza, latas:totalCans(), total:+(sub*(1-pct/100)).toFixed(2), descuento_pct:pct, booms:state.booms||0}); } });
/* sonido on/off */
function pintaSonido(){ const b=$("sndBtn"); b.setAttribute("aria-pressed",muted?"true":"false"); b.setAttribute("aria-label",muted?"Activar el sonido":"Silenciar el sonido"); }
pintaSonido();

  if(master) master.gain.setTargetAtTime(muted?0:0.9,AC.currentTime,0.02); pintaSonido(); if(!muted) taka(0); });

/* guía del primer toque: una mano sobre la lata de piña */
const coach=$("coach"); let coachOn=false, coachT=null;
function showCoach(){ if(state.taps.pina+state.taps.cereza>0||totalCans()>0) return; coachOn=true; coach.classList.add("on");
  let hold=false;
  const paso=()=>{ if(!coachOn) return; coachT=setTimeout(()=>{ hold=!hold; coach.classList.toggle("hold",hold);
    $("coachTxt").innerHTML = hold ? `<b>Mantén</b> = TaKáBOOM −${CONFIG.pctExplosion}%` : `<b>Toca</b> = +1 lata`; paso(); }, hold?2400:3200); };
  paso(); }
function hideCoach(){ if(!coachOn) return; coachOn=false; clearTimeout(coachT); coach.classList.remove("on"); }
const vCoach=new THREE.Vector3();
function placeCoach(){ const c=cans.pina; if(!c) return; c.root.getWorldPosition(vCoach); vCoach.project(cam);
  coach.style.transform=`translate(${(vCoach.x+1)/2*innerWidth}px,${(1-vCoach.y)/2*innerHeight}px)`; }

function resetCans(){ for(const id in cans){ const c=cans[id]; if(!c.alive){ c.alive=true; c.root.visible=true; state.taps[id]=0; c.scale=0.2; c.target=1; c.speed=1.1; } }
  refreshHUD(); }

/* ---------------- animación ---------------- */
const clock=new THREE.Clock();
function frame(){
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;
  for(const id in cans){ const c=cans[id];
    c.scale+=(c.target-c.scale)*Math.min(1,dt*12);
    c.wob*=Math.pow(0.02,dt);
    const squash=1+0.12*c.wob*Math.sin(t*38);
    c.root.scale.set(c.scale/Math.sqrt(squash), c.scale*squash, c.scale/Math.sqrt(squash));
    c.speed+= (1.1-c.speed)*Math.min(1,dt*0.6);
    c.spin.rotation.y += dt*c.speed;
    const other=cans[id==="pina"?"cereza":"pina"], os=other&&other.alive?other.scale:1;
    const shake=reduce?0:Math.max(0,(state.taps[id]/CONFIG.explota)-0.6)*0.004;
    c.root.position.set(FLAV[id].x*(0.072+0.022*(c.scale-1)+0.012*(os-1)) + (Math.random()-.5)*shake,
                        0.006*Math.sin(t*1.6+c.phase)+(Math.random()-.5)*shake, 0);
  }
  for(let bi=bursts.length-1; bi>=0; bi--){ const burst=bursts[bi]; burst.t+=dt; const p=burst.pts.geometry.attributes.position;
    for(let i=0;i<burst.vel.length;i++){ const v=burst.vel[i]; v.y-=0.6*dt; v.multiplyScalar(Math.pow(0.6,dt)); p.array[i*3]+=v.x*dt; p.array[i*3+1]+=v.y*dt; p.array[i*3+2]+=v.z*dt; }
    p.needsUpdate=true; burst.pts.material.opacity=Math.max(0,1-burst.t/2.2);
    const s=1+burst.t*30; burst.ring.scale.set(s,s,s); burst.ring.material.opacity=Math.max(0,.7-burst.t*1.8); burst.ring.lookAt(cam.position);
    if(burst.t>2.4){ scene.remove(burst.pts); scene.remove(burst.ring); burst.pts.geometry.dispose(); burst.ring.geometry.dispose(); bursts.splice(bi,1); } }
  if(coachOn) placeCoach();
  renderer.render(scene,cam); requestAnimationFrame(frame);
}

layout(); refreshHUD();

Promise.all([loadCan("pina"),loadCan("cereza")]).then(()=>{ $("loading").hidden=true; frame(); setTimeout(showCoach, 700); })
  .catch(err=>{ $("loading").textContent="TaKá…? ↻ (recarga la página)"; console.error(err); });
